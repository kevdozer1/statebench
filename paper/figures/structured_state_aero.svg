<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1ecff"/>
      <stop offset="0.55" stop-color="#fbf8ff"/>
      <stop offset="1" stop-color="#fff6e6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobfill" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#faf7ff"/>
      <stop offset="0.45" stop-color="#cdbff9"/>
      <stop offset="0.85" stop-color="#9d86ec"/>
      <stop offset="1" stop-color="#7b5fd8"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff0d8"/>
    </linearGradient>
    <linearGradient id="pillshine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#fbc97c"/>
      <stop offset="1" stop-color="#e0892f"/>
    </radialGradient>
    <radialGradient id="wheel" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f5f1fc"/>
      <stop offset="1" stop-color="#e6def7"/>
    </radialGradient>
    <radialGradient id="button" cx="0.4" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#efe9fb"/>
    </radialGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3a8"/>
      <stop offset="0.5" stop-color="#f5b35c"/>
      <stop offset="1" stop-color="#e0802a"/>
    </linearGradient>
    <radialGradient id="bubble" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#efe8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe3b8" stop-opacity="0.15"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#6a52c4" flood-opacity="0.28"/>
    </filter>
    <filter id="softshadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#6a52c4" flood-opacity="0.22"/>
    </filter>
    <clipPath id="blobclip">
      <path id="blobpath" d="M 150 440 C 130 260, 320 130, 540 142 C 720 152, 830 100, 945 196 C 1060 292, 1030 430, 1020 530 C 1008 650, 915 772, 705 782 C 520 792, 425 752, 300 708 C 178 664, 166 570, 150 440 Z"/>
    </clipPath>
    <marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="3.4" markerHeight="3.4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e39a3a"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- bubbles -->
  <circle cx="1480" cy="140" r="46" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2"/>
  <circle cx="1400" cy="96" r="18" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2"/>
  <circle cx="104" cy="128" r="30" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2"/>
  <circle cx="1130" cy="800" r="22" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2"/>
  <circle cx="1540" cy="790" r="30" fill="url(#bubble)" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2"/>

  <!-- the state -->
  <g filter="url(#shadow)">
    <use href="#blobpath" fill="url(#blobfill)" stroke="#ffffff" stroke-width="5"/>
  </g>
  <g clip-path="url(#blobclip)">
    <ellipse cx="560" cy="170" rx="430" ry="150" fill="url(#gloss)" opacity="0.85"/>
  </g>
  <text x="585" y="262" text-anchor="middle" font-family="Segoe UI, Lucida Grande, Helvetica Neue, Arial, sans-serif" font-size="46" font-weight="600" fill="#3b2a6b">structured state</text>

  <!-- the four pieces -->
  <g font-family="Segoe UI, Lucida Grande, Helvetica Neue, Arial, sans-serif" font-size="34" fill="#3b2a6b">
    <g filter="url(#softshadow)">
      <rect x="300" y="300" width="570" height="84" rx="42" fill="url(#pill)" stroke="#f3c887" stroke-width="3"/>
      <rect x="300" y="404" width="570" height="84" rx="42" fill="url(#pill)" stroke="#f3c887" stroke-width="3"/>
      <rect x="300" y="508" width="570" height="84" rx="42" fill="url(#pill)" stroke="#f3c887" stroke-width="3"/>
      <rect x="300" y="612" width="570" height="84" rx="42" fill="url(#pill)" stroke="#f3c887" stroke-width="3" stroke-dasharray="12 9"/>
    </g>
    <rect x="310" y="306" width="550" height="36" rx="18" fill="url(#pillshine)" opacity="0.7"/>
    <rect x="310" y="410" width="550" height="36" rx="18" fill="url(#pillshine)" opacity="0.7"/>
    <rect x="310" y="514" width="550" height="36" rx="18" fill="url(#pillshine)" opacity="0.7"/>
    <rect x="310" y="618" width="550" height="36" rx="18" fill="url(#pillshine)" opacity="0.7"/>

    <!-- icons: tracking (target), menu (lines), goal (flag), contact (pen tip on a line) -->
    <circle cx="352" cy="342" r="26" fill="url(#orb)"/>
    <circle cx="352" cy="342" r="11" fill="none" stroke="#ffffff" stroke-width="4"/>
    <circle cx="352" cy="342" r="3.5" fill="#ffffff"/>

    <circle cx="352" cy="446" r="26" fill="url(#orb)"/>
    <path d="M340 436 H364 M340 446 H364 M340 456 H358" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

    <circle cx="352" cy="550" r="26" fill="url(#orb)"/>
    <path d="M343 564 V534 M343 535 L365 542 L343 550" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <circle cx="352" cy="654" r="26" fill="url(#orb)"/>
    <path d="M338 666 H366 M350 662 L360 640 M354 664 L364 642" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>

    <text x="400" y="354">tracking data</text>
    <text x="400" y="458">action menu</text>
    <text x="400" y="562">goal with a clear end</text>
    <text x="400" y="666">contact labels, if needed</text>
  </g>

  <!-- the verifier, outside the state -->
  <path d="M 1028 470 C 1060 446, 1080 436, 1098 434" fill="none" stroke="#e39a3a" stroke-width="6" stroke-linecap="round" marker-end="url(#head)"/>
  <g filter="url(#shadow)">
    <circle cx="1330" cy="430" r="172" fill="url(#wheel)" stroke="#d9cdf3" stroke-width="3"/>
  </g>
  <circle cx="1330" cy="430" r="198" fill="none" stroke="#ebe4fa" stroke-width="18"/>
  <path d="M 1330 232 A 198 198 0 1 1 1159.5 530.7" fill="none" stroke="url(#green)" stroke-width="18" stroke-linecap="round"/>
  <circle cx="1330" cy="430" r="70" fill="url(#button)" stroke="#d9cdf3" stroke-width="3"/>
  <ellipse cx="1330" cy="398" rx="52" ry="26" fill="#ffffff" opacity="0.8"/>
  <text x="1330" y="442" text-anchor="middle" font-family="Segoe UI, Lucida Grande, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="600" fill="#3b2a6b">verifier</text>
  <text x="1330" y="686" text-anchor="middle" font-family="Segoe UI, Lucida Grande, Helvetica Neue, Arial, sans-serif" font-size="30" fill="#3b2a6b">scores progress toward the goal</text>
</svg>
