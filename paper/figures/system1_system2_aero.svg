<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3efff"/>
      <stop offset="0.55" stop-color="#fbf7ff"/>
      <stop offset="1" stop-color="#fff6e6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfc2fb"/>
      <stop offset="0.5" stop-color="#a893f0"/>
      <stop offset="1" stop-color="#7f66d9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5de"/>
      <stop offset="0.55" stop-color="#fbd79d"/>
      <stop offset="1" stop-color="#f0ad55"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#efe9ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="bubble" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#efe8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe3b8" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6a52c4" flood-opacity="0.25"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a63d6"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e39a3a"/>
    </marker>
  </defs>

  <rect width="1800" height="760" fill="url(#bg)"/>
  <rect width="1800" height="760" fill="url(#glow)"/>
  <circle cx="1690" cy="90" r="42" fill="url(#bubble)" stroke="#fff" stroke-opacity="0.8" stroke-width="2"/>
  <circle cx="1620" cy="60" r="16" fill="url(#bubble)" stroke="#fff" stroke-opacity="0.8" stroke-width="2"/>
  <circle cx="90" cy="660" r="34" fill="url(#bubble)" stroke="#fff" stroke-opacity="0.8" stroke-width="2"/>
  <circle cx="1740" cy="690" r="22" fill="url(#bubble)" stroke="#fff" stroke-opacity="0.8" stroke-width="2"/>

  <g font-family="Segoe UI, Lucida Grande, Helvetica Neue, Arial, sans-serif">
    <!-- arrows along the row -->
    <g stroke="#7a63d6" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M 318 330 L 468 330" marker-end="url(#ahg)" stroke="#e39a3a"/>
      <path d="M 842 330 L 992 330" marker-end="url(#ah)"/>
      <path d="M 1248 330 L 1392 330" marker-end="url(#ah)"/>
      <!-- scene back into the state -->
      <path d="M 1570 470 L 1570 610 L 657 610 L 657 408" marker-end="url(#ah)"/>
      <!-- Jev reports to Sol -->
      <path d="M 1120 262 L 1120 120 L 190 120 L 190 250" stroke-dasharray="16 14" marker-end="url(#ah)"/>
    </g>
    <g font-size="30" fill="#3b2a6b" text-anchor="middle">
      <text x="393" y="310">writes plan</text>
      <text x="917" y="310">reads state</text>
      <text x="1320" y="310">next action</text>
      <text x="1113" y="652">the scene updates the state</text>
      <text x="655" y="100">reports only when a step along the plan fails</text>
    </g>

    <!-- Sol -->
    <g filter="url(#shadow)"><rect x="70" y="262" width="240" height="136" rx="68" fill="url(#purple)" stroke="#fff" stroke-width="4"/></g>
    <rect x="92" y="270" width="196" height="54" rx="27" fill="url(#shine)" opacity="0.75"/>
    <text x="190" y="348" text-anchor="middle" font-size="50" font-weight="700" fill="#ffffff">Sol</text>

    <!-- structured state -->
    <g filter="url(#shadow)"><rect x="476" y="258" width="362" height="144" rx="40" fill="url(#gold)" stroke="#fff" stroke-width="4"/></g>
    <rect x="498" y="266" width="318" height="56" rx="26" fill="url(#shine)" opacity="0.8"/>
    <text x="657" y="344" text-anchor="middle" font-size="38" font-weight="600" fill="#5a3a12">structured state</text>

    <!-- Jev -->
    <g filter="url(#shadow)"><rect x="1000" y="262" width="240" height="136" rx="68" fill="url(#purple)" stroke="#fff" stroke-width="4"/></g>
    <rect x="1022" y="270" width="196" height="54" rx="27" fill="url(#shine)" opacity="0.75"/>
    <text x="1120" y="348" text-anchor="middle" font-size="50" font-weight="700" fill="#ffffff">Jev</text>
    <text x="1120" y="448" text-anchor="middle" font-size="28" fill="#3b2a6b">~0.2 s per decision</text>
    <text x="1120" y="486" text-anchor="middle" font-size="28" fill="#3b2a6b">5,294 runs for $3.43</text>

    <!-- robot in the scene -->
    <g filter="url(#shadow)"><rect x="1400" y="190" width="340" height="280" rx="34" fill="url(#card)" stroke="#fff" stroke-width="4"/></g>
    <rect x="1418" y="198" width="304" height="60" rx="26" fill="url(#shine)" opacity="0.7"/>
    <text x="1570" y="240" text-anchor="middle" font-size="26" fill="#6b5aa6">robot in the scene</text>
    <line x1="1428" y1="420" x2="1712" y2="420" stroke="#8e7fc2" stroke-width="5" stroke-linecap="round"/>
    <rect x="1440" y="378" width="54" height="42" rx="9" fill="#7f66d9"/>
    <path d="M 1467 378 L 1505 290 L 1600 280 L 1600 342" stroke="#a893f0" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="1505" cy="290" r="13" fill="#6a52c4"/>
    <circle cx="1600" cy="280" r="13" fill="#6a52c4"/>
    <path d="M 1584 342 L 1616 342 M 1586 342 L 1586 368 M 1614 342 L 1614 368" stroke="#6a52c4" stroke-width="7" stroke-linecap="round"/>
    <rect x="1538" y="390" width="30" height="30" rx="4" fill="#f0923e" stroke="#c96e22" stroke-width="2"/>
    <path d="M 1634 386 L 1634 420 L 1704 420 L 1704 386" stroke="#e39a3a" stroke-width="6" fill="#ffe9c7" stroke-linejoin="round"/>
  </g>
</svg>
