[project]
name = "statebench"
version = "1.0.0"
description = "What a robot's text state needs for a language model to act on it: positions, a skill menu, contact, and a complete goal."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco==3.13.0",
    "numpy==2.5.3",
    "Pillow==12.3.0",
    "matplotlib==3.10.7",
    "scipy==1.18.1",
    "scikit-learn==1.7.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
statebench = "statebench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
